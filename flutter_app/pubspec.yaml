name: nur_al_quran
description: "Nur-ul-Quran (نور القرآن) - 15 Line Offline Hifzi Mushaf, Prayer Times with Azan, Qiblah Compass & Multi-Language Voice Search"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Audio & Recitation
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  wakelock_plus: ^1.2.8

  # Azan Alarms & Notifications (Background & Lockscreen)
  flutter_local_notifications: ^17.2.3
  android_alarm_manager_plus: ^3.0.4

  # Sensors & Location
  flutter_compass: ^0.7.3
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Voice Search (Hindi, Urdu, English)
  speech_to_text: ^7.0.0

  # UI & Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/icons/

