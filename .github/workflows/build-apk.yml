name: Build Android APK

# Builds a signed-ready (unsigned) release APK of the Nur-Al-Quran Flutter app.
# The APK is signed afterwards with the real release keystore, which is kept
# off GitHub, and published as a GitHub Release asset.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUR_UNSIGNED_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.1.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install Dart dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build unsigned release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Nur-Al-Quran-unsigned-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
