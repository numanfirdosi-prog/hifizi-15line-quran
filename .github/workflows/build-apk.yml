name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.1.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Configure Release Signing Key
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > flutter_app/android/app/release.jks
          cat <<EOF > flutter_app/android/key.properties
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Install Dart dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build signed release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Build signed release App Bundle (AAB)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Extract App Version
        id: version
        run: |
          VERSION=$(grep '^version:' flutter_app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version is v$VERSION"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_dist
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release_dist/Nur-Al-Quran.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release_dist/Nur-Al-Quran-${{ env.APP_VERSION }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Nur-Al-Quran ${{ env.APP_VERSION }} — Official Release"
          body: |
            Nur-Al-Quran ${{ env.APP_VERSION }}
            
            ### 🌟 Features & Highlights:
            - **100% Authentic Ayah Highlight Alignment for Juz 1 & Juz 2:**
              All ayah highlight segments verified and aligned against original 15-line Mushaf page images.
            - **Ayah Highlighter Redesign:**
              Multiply blend mode keeping Arabic calligraphy pitch-black and razor sharp with soft pastel highlighters.
            - **Bismillah Cartouche Centering:**
              Perfect vertical alignment inside illuminated frame.
            - **Direct Parah & Page Jump:**
              Jump to any Parah (1-30) and Page within Parah (1-20), or directly jump to any Mushaf page.
          files: |
            release_dist/Nur-Al-Quran.apk
            release_dist/Nur-Al-Quran-${{ env.APP_VERSION }}.apk
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          make_latest: true

